<wo:PLLook section="bundles" pretitle="Bundles" title="Loaded bundles" subtitle="The application and the frameworks it loaded.">
	<div class="card">
		<div class="table-responsive">
			<table class="table table-vcenter card-table">
				<thead><tr><th>Name</th><th>Version</th><th>Type</th><th>Path</th></tr></thead>
				<tbody>
					<wo:repetition list="$examination.bundleDefinitions" item="$currentBundle">
						<tr>
							<td>
								<wo:str value="$currentBundle.bundle.name" />
								<wo:if condition="$currentBundle.isMain"><span class="badge bg-azure-lt ms-1">Application</span></wo:if>
							</td>
							<td class="text-secondary"><wo:str value="$currentBundle.version" /></td>
							<td class="text-secondary"><wo:str value="$currentBundle.bundle.class.simpleName" /></td>
							<td class="wrap text-secondary small mono"><wo:str value="$currentBundle.bundle.bundlePath" /></td>
						</tr>
					</wo:repetition>
				</tbody>
			</table>
		</div>
	</div>
</wo:PLLook>
