<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
		<wo:WOGenericElement elementName="link" rel="stylesheet" href="$tablerCSSURL" />
		<title><wo:str value="$documentTitle" /></title>
		<style>
			body { overflow-y: scroll; }
			.navbar-brand-image { height: 28px; }
			.brand-app { font-weight: 400; color: var(--tblr-secondary); margin-left: .5rem; }
			.table td, .table th { white-space: nowrap; }
			.table td.wrap { white-space: normal; }
			.mono, .table td.mono { font-family: var(--tblr-font-monospace); font-size: .8125rem; }
			.stat-link { color: inherit; text-decoration: none; }
			.stat-link:hover .card { border-color: var(--tblr-primary); }
			.card-body, .tab-content, .tab-pane { min-width: 0; }
			.source { font-family: var(--tblr-font-monospace); font-size: .8125rem; line-height: 1.5; margin: 0; padding: 0; counter-reset: line; overflow-x: auto; max-width: 100%; tab-size: 4; }
			.source .lines { display: inline-block; min-width: 100%; }
			.source .line { display: block; white-space: pre; padding-right: 1rem; }
			.source .line::before { counter-increment: line; content: counter(line); display: inline-block; width: 3.5em; padding-right: 1em; margin-right: .75em; text-align: right; color: var(--tblr-secondary); border-right: 1px solid var(--tblr-border-color); user-select: none; }
			.source .line.error { background: var(--tblr-danger-lt); }
		</style>
	</head>
	<body>
		<div class="page">
			<header class="navbar navbar-expand-md d-print-none">
				<div class="container-xl">
					<h1 class="navbar-brand pe-0 pe-md-3">
						<wo:link actionClass="PLExaminerAction" directActionName="default" class="text-reset text-decoration-none">
							<wo:img filename="img/logo.png" framework="examiner" alt="" class="navbar-brand-image me-2" />Examiner<span class="brand-app"><wo:str value="$examination.applicationName" /></span>
						</wo:link>
					</h1>
					<div class="navbar-nav flex-row order-md-last align-items-center">
						<span class="text-secondary small me-3 d-none d-lg-inline">Examined in <wo:str value="$examination.durationMillis" /> ms</span>
						<wo:link actionClass="PLExaminerAction" directActionName="rescan" class="btn btn-sm">Rescan</wo:link>
					</div>
				</div>
			</header>
			<header class="navbar-expand-md">
				<div class="navbar navbar-light">
					<div class="container-xl">
						<ul class="navbar-nav">
							<wo:repetition list="$navItems" item="$currentNavItem">
								<wo:container elementName="li" class="$currentNavItemClass">
									<wo:link actionClass="PLExaminerAction" directActionName="$currentNavItem.directActionName" class="nav-link"><span class="nav-link-title"><wo:str value="$currentNavItem.label" /></span></wo:link>
								</wo:container>
							</wo:repetition>
						</ul>
					</div>
				</div>
			</header>
			<div class="page-wrapper">
				<div class="page-header d-print-none">
					<div class="container-xl">
						<div class="row g-2 align-items-center">
							<div class="col">
								<wo:if condition="$pretitle"><div class="page-pretitle"><wo:str value="$pretitle" /></div></wo:if>
								<h2 class="page-title"><wo:str value="$title" /></h2>
								<wo:if condition="$subtitle"><div class="text-secondary mt-1"><wo:str value="$subtitle" /></div></wo:if>
							</div>
						</div>
					</div>
				</div>
				<div class="page-body">
					<div class="container-xl">
						<wo:content />
					</div>
				</div>
				<footer class="footer footer-transparent d-print-none">
					<div class="container-xl text-secondary small">
						Examiner, examining <wo:str value="$examination.applicationName" /> on WebObjects <wo:str value="$webObjectsVersion" /> and Java <wo:str value="$javaVersion" />
					</div>
				</footer>
			</div>
		</div>
		<wo:WOGenericContainer elementName="script" src="$tablerJSURL" defer="defer"></wo:WOGenericContainer>
	</body>
</html>
